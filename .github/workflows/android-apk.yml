name: Build Young English Android APK
on:
  push:
    branches: [pwa-installable-2026-10-07]
    paths: ['android/**','.github/workflows/android-apk.yml']
  pull_request:
    branches: [master-next-cycle-2026-10-05]
    paths: ['android/**','.github/workflows/android-apk.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Young-English-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
