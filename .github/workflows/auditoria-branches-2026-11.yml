name: Auditoria de branches e baseline
on:
  push:
    branches: [backup/auditoria-2026-11]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Comparar todas as branches com main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p report
          git init --bare report/repo.git
          git -C report/repo.git remote add origin "https://github.com/$REPO.git"
          git -C report/repo.git -c 'credential.helper=!f() { echo username=x-access-token; echo password="$GH_TOKEN"; }; f' fetch origin '+refs/heads/*:refs/heads/*'
          git -C report/repo.git fsck --full --no-reflogs
          {
            echo '# Comparacao de todas as branches com main'
            echo ''
            echo '| Branch | Ahead | Behind | main ancestral | Exclusivos | Arquivos diferentes |'
            echo '|---|---:|---:|---|---:|---:|'
            while IFS= read -r branch; do
              test "$branch" = main && continue
              ahead="$(git -C report/repo.git rev-list --count "refs/heads/main..refs/heads/$branch")"
              behind="$(git -C report/repo.git rev-list --count "refs/heads/$branch..refs/heads/main")"
              ancestor=no
              git -C report/repo.git merge-base --is-ancestor refs/heads/main "refs/heads/$branch" && ancestor=yes || true
              exclusive="$(git -C report/repo.git rev-list --count "refs/heads/main..refs/heads/$branch")"
              files="$(git -C report/repo.git diff --name-only refs/heads/main "refs/heads/$branch" | wc -l)"
              echo "| \`$branch\` | $ahead | $behind | $ancestor | $exclusive | $files |"
              git -C report/repo.git diff --name-status refs/heads/main "refs/heads/$branch" > "report/files-$(echo "$branch" | tr '/' '_').txt"
              git -C report/repo.git log --format='%h %s' "refs/heads/main..refs/heads/$branch" > "report/commits-$(echo "$branch" | tr '/' '_').txt"
            done < <(git -C report/repo.git for-each-ref --format='%(refname:strip=2)' refs/heads)
          } > report/BRANCHES.md
          rm -rf report/repo.git
      - uses: actions/upload-artifact@v4
        with:
          name: comparacao-branches-${{ github.event.repository.name }}
          path: report/
          retention-days: 7
          if-no-files-found: error
