name: UX validacao completa
on:
  push:
    branches: [ux/simplificacao-2026-11]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Teste de UX
        run: node --test tests/ux-simplificacao.test.mjs
      - name: Testes existentes
        run: npm test
      - name: Validacao estatica
        run: npm run check
      - name: Build
        run: npm run build
