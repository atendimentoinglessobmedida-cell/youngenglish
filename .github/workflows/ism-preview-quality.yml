name: ISM Preview Quality
on:
  push:
    branches: ['preview/ism-shared-kit-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run verify
      - name: Preview and promotion policy
        run: echo "Preview only. No production deployment, write token, domain or data mutation is permitted in this workflow."
